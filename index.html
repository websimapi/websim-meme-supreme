<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Supreme</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .card {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .card-text {
      font-size: 1.1em;
      line-height: 1.4;
    }

    .generate-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.2s;
    }

    .generate-btn:disabled {
      background: #2a2a2a;
      cursor: not-allowed;
    }

    .generate-btn:hover:not(:disabled) {
      background: #45a049;
    }

    h1 {
      color: #4CAF50;
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
    }

    .loading {
      text-align: center;
      font-size: 1.2em;
      margin: 20px 0;
      color: #4CAF50;
    }

    .error {
      color: #ff4444;
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>

</html>
